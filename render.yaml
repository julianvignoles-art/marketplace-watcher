services:
  - type: web
    name: marketplace-watcher
    runtime: docker
    plan: starter
    autoDeploy: true
    disk:
      name: marketplace-watcher-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:/data/app.db"
